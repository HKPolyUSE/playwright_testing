<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Todo List</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
  <div class="container mx-auto px-4 py-8 max-w-3xl">
    <div class="bg-white rounded-lg shadow-lg p-6">
      <!-- Header -->
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-indigo-600">My Todo List</h1>
        <a 
          href="/logout" 
          class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition font-medium"
        >
          Logout
        </a>
      </div>

      <!-- Add Todo Form -->
      <div class="mb-6">
        <form id="add-todo-form" class="flex gap-2">
          <input 
            type="text" 
            id="todo-input" 
            placeholder="Add a new todo..." 
            required
            class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
          >
          <button 
            type="submit" 
            class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 focus:ring-4 focus:ring-indigo-300 transition font-medium"
          >
            Add
          </button>
        </form>
      </div>

      <!-- Todo Stats -->
      <div class="grid grid-cols-3 gap-4 mb-6">
        <div class="bg-blue-50 p-4 rounded-lg text-center">
          <p class="text-2xl font-bold text-blue-600" id="total-count">0</p>
          <p class="text-sm text-gray-600">Total</p>
        </div>
        <div class="bg-green-50 p-4 rounded-lg text-center">
          <p class="text-2xl font-bold text-green-600" id="completed-count">0</p>
          <p class="text-sm text-gray-600">Completed</p>
        </div>
        <div class="bg-yellow-50 p-4 rounded-lg text-center">
          <p class="text-2xl font-bold text-yellow-600" id="pending-count">0</p>
          <p class="text-sm text-gray-600">Pending</p>
        </div>
      </div>

      <!-- Todo List -->
      <div id="todo-list" class="space-y-2">
        <!-- Todos will be dynamically added here -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="text-center py-12 hidden">
        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
        </svg>
        <p class="mt-4 text-gray-500 text-lg">No todos yet. Add one to get started!</p>
      </div>
    </div>
  </div>

  <script>
    let todos = [];

    // Load todos on page load
    async function loadTodos() {
      try {
        const response = await fetch('/api/todos');
        todos = await response.json();
        renderTodos();
      } catch (error) {
        console.error('Error loading todos:', error);
      }
    }

    // Render todos
    function renderTodos() {
      const todoList = document.getElementById('todo-list');
      const emptyState = document.getElementById('empty-state');
      
      if (todos.length === 0) {
        todoList.innerHTML = '';
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        todoList.innerHTML = todos.map(todo => `
          <div class="flex items-center gap-3 p-4 bg-gray-50 rounded-lg hover:bg-gray-100 transition ${todo.completed ? 'opacity-60' : ''}">
            <input 
              type="checkbox" 
              ${todo.completed ? 'checked' : ''} 
              onchange="toggleTodo(${todo.id})"
              class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer"
            >
            <span class="flex-1 ${todo.completed ? 'line-through text-gray-500' : 'text-gray-800'}">${escapeHtml(todo.text)}</span>
            <button 
              onclick="deleteTodo(${todo.id})" 
              class="text-red-500 hover:text-red-700 font-medium px-3 py-1 rounded hover:bg-red-50 transition"
            >
              Delete
            </button>
          </div>
        `).join('');
      }
      
      updateStats();
    }

    // Update statistics
    function updateStats() {
      const total = todos.length;
      const completed = todos.filter(t => t.completed).length;
      const pending = total - completed;
      
      document.getElementById('total-count').textContent = total;
      document.getElementById('completed-count').textContent = completed;
      document.getElementById('pending-count').textContent = pending;
    }

    // Add todo
    document.getElementById('add-todo-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const input = document.getElementById('todo-input');
      const text = input.value.trim();
      
      if (!text) return;
      
      try {
        const response = await fetch('/api/todos', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ text })
        });
        
        const newTodo = await response.json();
        todos.push(newTodo);
        renderTodos();
        input.value = '';
      } catch (error) {
        console.error('Error adding todo:', error);
        alert('Failed to add todo');
      }
    });

    // Toggle todo completion
    async function toggleTodo(id) {
      try {
        const todo = todos.find(t => t.id === id);
        const response = await fetch(`/api/todos/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ completed: !todo.completed })
        });
        
        const updatedTodo = await response.json();
        const index = todos.findIndex(t => t.id === id);
        todos[index] = updatedTodo;
        renderTodos();
      } catch (error) {
        console.error('Error toggling todo:', error);
        alert('Failed to update todo');
      }
    }

    // Delete todo
    async function deleteTodo(id) {
      if (!confirm('Are you sure you want to delete this todo?')) return;
      
      try {
        await fetch(`/api/todos/${id}`, {
          method: 'DELETE'
        });
        
        todos = todos.filter(t => t.id !== id);
        renderTodos();
      } catch (error) {
        console.error('Error deleting todo:', error);
        alert('Failed to delete todo');
      }
    }

    // Utility function to escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Load todos on page load
    loadTodos();
  </script>
</body>
</html>
